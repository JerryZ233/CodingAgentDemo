# LLM Configuration
# Environment variables override these settings

llm:
  # Error semantics: auto, openai, zhipu, deepseek, dashscope, gemini, generic
  # auto uses exact registered endpoint hostnames, never the model name
  provider: "deepseek"
  # Retries per model request, excluding the first attempt (0 disables)
  max_retries: 10
  retry_initial_delay_ms: 2000
  retry_max_delay_ms: 30000
  # Include redacted/truncated provider message and selected nested fields
  error_details: false
  # API endpoint (OpenAI-compatible)
  # Can be overridden by LLM_API_URL environment variable
  api_url: "https://api.deepseek.com/chat/completions"
  
  # Model name
  # Can be overridden by LLM_MODEL environment variable
  model: "deepseek-flash"
  
  # API key
  # Can be overridden by LLM_API_KEY environment variable
  # Store secrets in git-ignored config.local.yaml or the environment
  api_key: ""
  
  # Maximum tokens to generate
  # Can be overridden by LLM_MAX_TOKENS environment variable
  max_tokens: 2048
  
  # Temperature for response generation
  # Can be overridden by LLM_TEMPERATURE environment variable
  temperature: 0.7

# Layered memory (environment: MEMORY_ENABLED, MEMORY_MAINTENANCE_ENABLED, etc.)
# Automatic maintenance uses the configured model. Disable to retain the legacy window.
memory:
  enabled: true
  consolidation:
    enabled: true
    new_history_threshold: 5
    batch_size: 10
  maintenance:
    enabled: true
    min_interval_hours: 24
    scan_interval_seconds: 60

# Agent Configuration
agent:
  # Maximum iterations for agent loop
  # Can be overridden by AGENT_MAX_ITERATIONS environment variable
  max_iterations: 10
  
  # Workspace directory for file operations
  # Can be overridden by WORKSPACE_DIR environment variable
  workspace_dir: "."

# Tool Configuration
tools:
  # Omitted: default file tools. Explicit []: disable all tools. Unknown names fail startup.
  enabled:
    - read_file
    - write_file
    - list_files
    - search_text
    # Each new exact plan requires interactive user approval.
    # Runs as the current user, without an OS sandbox; foreground tasks only.
    - run_shell
