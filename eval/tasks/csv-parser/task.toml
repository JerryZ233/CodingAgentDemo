schema_version = "1.4"
artifacts = ["/workspace/src"]
[metadata]
name = "csv-parser"
[environment]
docker_image = "coding-agent-eval-csv-parser:local"
cpus = 2
memory_mb = 2048
workdir = "/workspace"
[agent]
timeout_sec = 660
[verifier]
timeout_sec = 120
environment_mode = "separate"
[verifier.environment]
docker_image = "coding-agent-verifier-csv-parser:local"
cpus = 2
memory_mb = 1024
